<!-- @dsCard group="Components" viewport="700x360" name="Brand" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="margin:0"><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Lockup && v.Button) return v; } catch (e) {} } return {}; })();
const { Lockup, HorseMark } = NS;
const A = '../../assets/logo/';
function App() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: 32, display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'var(--fr-cream)' }}><Lockup assetBase={A} /><HorseMark height={56} assetBase={A} /></div>
      <div style={{ padding: 32, display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'var(--fr-green)' }}><Lockup tone="dark" assetBase={A} /><HorseMark color="gold" height={56} assetBase={A} /></div>
      <div style={{ padding: '20px 32px', display: 'flex', gap: 40, alignItems: 'center', background: 'var(--fr-sand)' }}><Lockup size="sm" assetBase={A} /><Lockup size="sm" showTagline={false} assetBase={A} /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
