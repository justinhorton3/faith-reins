<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="margin:0"><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Lockup && v.Button) return v; } catch (e) {} } return {}; })();
const { Button, TextLink, Eyebrow } = NS;
function App() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: 28, display: 'flex', flexDirection: 'column', gap: 20, background: 'var(--fr-cream)' }}>
        <Eyebrow>Eyebrow · gold ink</Eyebrow>
        <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
          <Button>Support Faith Reins</Button><Button variant="outline">Send a referral</Button><Button size="sm">Small</Button><Button disabled>Disabled</Button><TextLink>Our horses</TextLink>
        </div>
      </div>
      <div style={{ padding: 28, display: 'flex', flexDirection: 'column', gap: 20, background: 'var(--fr-green)' }}>
        <Eyebrow tone="light" rule tracking=".3em">Pediatric &amp; Equine Therapy</Eyebrow>
        <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
          <Button variant="accent">Contact us</Button><Button variant="outline-inverse">Learn more</Button><TextLink tone="light" arrow>Our therapies</TextLink>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
