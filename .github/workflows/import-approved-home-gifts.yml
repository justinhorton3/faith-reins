name: Import approved Home and Gifts V7 hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-approved-home-gifts.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify exact approved desktop/mobile source bytes and export
        run: python scripts/sync-home-gifts-assets.py
      - name: Commit approved photo masters and website assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/shop/v7/heroes/home-gifts-*.webp
          git add brand/v7-design-system/foundations/photography/storefront/home-gifts/
          git add brand/v7-design-system/FILE-CHECKSUMS.json
          git add docs/storefront-heroes/home-gifts-assets.json
          git diff --cached --check
          git commit -m "assets(v7): archive approved Home & Gifts desktop and mobile heroes"
          git push origin HEAD:main
