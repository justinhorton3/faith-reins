name: Preview web

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wix-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      WIX_CLI: '@wix/cli@1.1.258'
      ASTRO_TELEMETRY_DISABLED: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current website dependencies
        run: npm ci --no-audit --no-fund
      - name: Authenticate Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo '::error::WIX_API_KEY is missing; no preview was uploaded.'
            exit 1
          fi
          npx --yes -p "$WIX_CLI" wix login --api-key "$WIX_API_KEY"
      - name: Load the linked project's server environment
        run: |
          npx --yes -p "$WIX_CLI" wix env pull > wix-env-pull.log
          node scripts/verify-account-environment.mjs
      - name: Build public pages and protected account runtime
        run: |
          npm run build:account
          python scripts/wix-postbuild.py
          node scripts/verify-account-artifacts.mjs
          node scripts/verify-navigation.mjs
          node scripts/verify-shop-category-routes.mjs
          node --test tests/careers-validation.mjs
      - name: Upload a preview without releasing production
        run: |
          set -o pipefail
          npx --yes -p "$WIX_CLI" wix preview 2>&1 | tee preview.log
      - name: Verify preview and post review link
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const log = fs.readFileSync('preview.log', 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
            const candidates = [...new Set((log.match(/https:\/\/[^\s"<>\\]+/g) || [])
              .map(value => value.replace(/[),;.}\]]+$/, '')))];
            let verified;
            for (const value of candidates) {
              let base;
              try { base = new URL(value); } catch { continue; }
              if (['faithreins.com', 'www.faithreins.com', 'dev.wix.com', 'manage.wix.com'].includes(base.hostname)) continue;
              const product = new URL('/shop/mens-polo.html', base);
              try {
                const response = await fetch(product, { signal: AbortSignal.timeout(30000) });
                const html = await response.text();
                if (!response.ok || !html.includes('data-polo-showcase') || !html.includes('Out of stock')) continue;
                const assetPaths = [...new Set(html.match(/\/assets\/shop\/v7\/polos\/[a-z-]+\.webp/g) || [])];
                if (!assetPaths.length) throw new Error('Polo images are absent from the hosted page.');
                for (const path of assetPaths) {
                  const asset = await fetch(new URL(path, base), { method: 'HEAD', signal: AbortSignal.timeout(30000) });
                  if (!asset.ok || !asset.headers.get('content-type')?.startsWith('image/')) {
                    throw new Error(`Preview asset failed: ${path} (${asset.status}).`);
                  }
                }
                for (const path of ['/get-involved.html', '/volunteer.html', '/account.html', '/for-families.html', '/for-referring-providers.html', '/shop/hats.html', '/join-our-team.html', '/join-our-team/clinical-director.html']) {
                  const page = await fetch(new URL(path, base), { signal: AbortSignal.timeout(30000) });
                  const content = await page.text();
                  if (!page.ok || !content.includes('data-mega-menu="involved"') || !content.includes('My Account')) {
                    throw new Error(`Navigation preview failed: ${path} (${page.status}).`);
                  }
                }
                const session = await fetch(new URL('/api/account/session', base));
                const sessionBody = await session.json();
                if (session.status !== 401 || sessionBody.error?.code !== 'SIGN_IN_REQUIRED' || !session.headers.get('cache-control')?.includes('no-store')) {
                  throw new Error('Protected account runtime did not reject signed-out access.');
                }
                const leaked = await fetch(new URL('/_worker.js/index.js', base));
                if (leaked.ok) throw new Error('Worker code must not be served as a public asset.');
                const { execFileSync } = require('node:child_process');
                execFileSync(process.execPath, ['scripts/verify-live-accounts.mjs', base.origin], { stdio: 'inherit' });
                verified = { home: new URL('/', base).href, product: product.href };
                break;
              } catch (error) { core.warning(`${product.href}: ${error.message}`); }
            }
            if (!verified) throw new Error('No working preview with the current polo page was found. Review the Wix preview log; production was not released.');
            const marker = '<!-- wix-preview-link -->';
            const sha = context.payload.pull_request?.head.sha || context.sha;
            const body = [marker, '### Preview this change', '',
              `**[Review website changes](${verified.home})**`,
              `[Careers](${new URL("/join-our-team.html", verified.home).href}) · [Clinical Director](${new URL("/join-our-team/clinical-director.html", verified.home).href})`,
              `[Get Involved](${new URL("/get-involved.html", verified.home).href}) · [Volunteer](${new URL("/volunteer.html", verified.home).href}) · [My Account](${new URL("/account.html", verified.home).href})`, '',
              `[Browse the preview site](${verified.home})`, '',
              `Source: \`${sha.slice(0, 7)}\`. This is a separate Wix preview; faithreins.com was not released.`,
              'Approved sitemap: About · Therapies · For Families · For Providers · Get Involved · Shop. Existing product availability is unchanged.',
            ].join('\n');
            await core.summary.addRaw(body).write();
            if (context.payload.pull_request) {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
              if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
