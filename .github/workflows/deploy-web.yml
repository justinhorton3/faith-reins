name: Deploy web
# Builds the Astro site and releases it to a Wix Headless site.
#
#   Pull request into main  -> stage       (stage.faithreins.com)
#   Push / merge to main    -> stage       (stage.faithreins.com)
#   GitHub release published -> production (www.faithreins.com)
#   Manual run               -> whichever target you pick
#
# Setup (Settings > Environments):
#   stage:      variable WIX_SITE_ID = the stage Wix site's ID (required)
#   production: variable WIX_SITE_ID optional; defaults to 2d8c6050-5730-4bed-9c7a-266ca7bd00b4
#               (add required reviewers here if you want a manual approval before going live)
# Secrets (repo or per environment):
#   WIX_API_KEY    Wix API key from the account that owns the site(s)
#   WIX_ACCOUNT_ID Wix account ID (also read from ACCOUNT_ID / WIX_ACCOUNT, secret or variable)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [stage, production]
        default: stage

permissions:
  contents: read

jobs:
  build-release:
    # Skip drafts and PRs from forks (they can't read secrets, and shouldn't deploy).
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'release' || inputs.target == 'production') && 'production' || 'stage' }}
      url: ${{ (github.event_name == 'release' || inputs.target == 'production') && 'https://www.faithreins.com' || 'https://stage.faithreins.com' }}
    concurrency:
      # One deploy per target at a time; never cancel one mid-upload.
      group: deploy-web-${{ (github.event_name == 'release' || inputs.target == 'production') && 'production' || 'stage' }}
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ (github.event_name == 'release' || inputs.target == 'production') && 'production' || 'stage' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Resolve target site
        env:
          SITE_VAR: ${{ vars.WIX_SITE_ID }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          C1: ${{ secrets.WIX_ACCOUNT_ID }}
          C2: ${{ vars.WIX_ACCOUNT_ID }}
          C3: ${{ secrets.ACCOUNT_ID }}
          C4: ${{ vars.ACCOUNT_ID }}
          C5: ${{ secrets.WIX_ACCOUNT }}
          C6: ${{ vars.WIX_ACCOUNT }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Secret WIX_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          site=$(echo "$SITE_VAR" | tr -d '[:space:]')
          if [ -z "$site" ] && [ "$DEPLOY_TARGET" = "production" ]; then
            site=2d8c6050-5730-4bed-9c7a-266ca7bd00b4
          fi
          if [ -z "$site" ]; then
            echo "::error::Variable WIX_SITE_ID is not set on the '$DEPLOY_TARGET' environment. Add it under Settings > Environments > $DEPLOY_TARGET."
            exit 1
          fi
          if [ "$DEPLOY_TARGET" = "stage" ] && [ "$site" = "2d8c6050-5730-4bed-9c7a-266ca7bd00b4" ]; then
            echo "::error::The stage environment points at the production Wix site. Give stage its own WIX_SITE_ID."
            exit 1
          fi
          echo "WIX_SITE_ID=$site" >> "$GITHUB_ENV"
          for n in 1 2 3 4 5 6; do
            v=$(eval echo "\$C$n" | tr -d '[:space:]')
            if [ -n "$v" ]; then echo "WIX_ACCOUNT_ID=$v" >> "$GITHUB_ENV"; break; fi
          done
          echo "::notice title=target::$DEPLOY_TARGET -> Wix site $site"

      - run: npm ci || npm install
      - run: npm run build
      - name: Prepare output for Wix hosting
        run: python scripts/wix-postbuild.py

      - name: Upload build to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          DEPLOY_LABEL: ${{ env.DEPLOY_TARGET }}
        run: bash scripts/wix-deploy.sh
