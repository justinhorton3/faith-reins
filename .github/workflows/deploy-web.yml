name: Deploy web
# Builds the Astro site and releases it to the live Wix Headless site
# (faithreins.com, metasite 2d8c6050-5730-4bed-9c7a-266ca7bd00b4 per wix.config.json).
# Requires repo secret WIX_API_KEY: a Wix API key from the account that owns the site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/releases/2026-10-16-shop-*.md'
      - '.github/releases/2026-10-17-sitemap-*.md'
      - '.github/releases/2026-10-17-account-*.md'
      - '.github/releases/2026-10-18-header-logo.md'
      - '.github/releases/2026-10-18-mission-and-giving.md'
      - '.github/releases/2026-10-18-favicon.md'
      - '.github/releases/2026-10-18-seo-ownership.md'
      - '.github/releases/2026-10-18-careers.md'
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      WIX_CLI: "@wix/cli@1.1.258"
      ASTRO_TELEMETRY_DISABLED: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Confirm production target
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync('wix.config.json'));
          assert.equal(config.projectType, 'Site');
          assert.equal(config.siteId, '2d8c6050-5730-4bed-9c7a-266ca7bd00b4');
          assert.deepEqual(config.site.outputDirectory, { client: './dist', server: './.wix-server' });
          JS
      - name: Check Wix API key is set
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Repo secret WIX_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - name: Authenticate Wix CLI with the existing release secret
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: npx --yes -p "$WIX_CLI" wix login --api-key "$WIX_API_KEY"
      - name: Load the linked project's server environment
        run: |
          npx --yes -p "$WIX_CLI" wix env pull > wix-env-pull.log
          node scripts/verify-account-environment.mjs
      - run: npm run build:account
      - name: Prepare output for Wix hosting
        run: |
          python scripts/wix-postbuild.py
          node scripts/verify-account-artifacts.mjs
          node scripts/verify-seo-artifacts.mjs
          node --test tests/careers-validation.mjs
      - name: Verify shop category pages, approved hero assets and host-compatible routes
        run: |
          node scripts/verify-shop-category-routes.mjs
          node scripts/verify-navigation.mjs
      - name: Keep active hero art and omit only unused duplicate photographs
        run: |
          # Assets copied for archival/traceability should not be uploaded
          # twice. Never delete an image currently referenced by HTML/CSS/JS.
          for asset in \
            coffee-porch.webp \
            heroes/shop-desktop.webp \
            heroes/shop-mobile.webp \
            heroes/hats-desktop.webp \
            heroes/hats-mobile.webp; do
            target="dist/assets/shop/v7/$asset"
            if [ ! -f "$target" ]; then continue; fi
            if grep -RFl --include='*.html' --include='*.css' --include='*.js' \
              "/assets/shop/v7/$asset" dist --exclude-dir=assets > /dev/null; then
              echo "::notice title=active hero::$target retained because pages reference it"
              continue
            fi
            rm "$target"
            echo "::notice title=unused asset::$target omitted from Wix upload only; source untouched"
          done
          # Confirm the restored Shop hero is included and referenced.
          test -s dist/assets/shop/v7/barn-collection.webp
          test -s dist/assets/shop/v7/heroes/hats-ranch-desktop.webp
          test -s dist/assets/shop/v7/heroes/hats-ranch-mobile.webp
          grep -q 'assets/shop/v7/barn-collection.webp' dist/shop.html
          grep -q 'assets/shop/v7/heroes/hats-ranch-desktop.webp' dist/shop/hats.html
      - name: Publish the linked Wix site and clear its cache
        run: timeout 540s npx --yes -p "$WIX_CLI" wix release
      - name: Verify production sitemap, routes and approved shop photography
        run: |
          node scripts/verify-live-navigation.mjs
          node scripts/verify-live-accounts.mjs
          node scripts/audit-live-metadata.mjs --fresh
