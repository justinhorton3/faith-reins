name: Deploy web
# Builds the Astro site and ships it to the Wix Headless site with the Wix CLI.
#
#   Pull request into main    -> `wix preview`; the preview link is posted on the PR
#                                (one comment, updated on every push) and in the run summary
#   GitHub release published  -> `wix release` to production (www.faithreins.com)
#   Manual run (Actions tab)  -> `wix release` to production, e.g. to re-publish or clear the cache
#
# Requires repo secret WIX_API_KEY: a Wix API key from the account that owns the site.
# The site itself comes from wix.config.json.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  WIX_CLI: "@wix/cli@latest"

jobs:
  preview:
    name: Preview build
    # Skip drafts and PRs from forks (they can't read secrets and shouldn't upload to Wix).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    concurrency:
      # A newer push to the same PR supersedes an in-flight preview.
      group: wix-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build site
        run: |
          npm ci || npm install
          npm run build
          python scripts/wix-postbuild.py

      - name: Log in to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Repo secret WIX_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes -p "$WIX_CLI" wix login --api-key "$WIX_API_KEY"

      - name: Create Wix preview
        id: wix
        run: |
          set -o pipefail
          npx --yes -p "$WIX_CLI" wix preview 2>&1 | tee preview.log
          # Pick the preview link out of the CLI output (plain text or JSON).
          urls=$(grep -oE 'https://[^"'"'"' )<>]+' preview.log | sed 's/[.,;]*$//' | grep -viE 'dev\.wix\.com/docs' | awk '!seen[$0]++')
          url=$(echo "$urls" | grep -iE 'preview|wixsite|wix-?host|wixstudio' | head -1)
          [ -z "$url" ] && url=$(echo "$urls" | head -1)
          if [ -z "$url" ]; then
            echo "::error::wix preview finished but no URL was found in its output (see log above)."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Wix preview"
            echo
            echo "**[$url]($url)**"
            echo
            echo "Built from \`${GITHUB_SHA::7}\` for PR #${{ github.event.pull_request.number }}."
            if [ "$(echo "$urls" | wc -l)" -gt 1 ]; then
              echo
              echo "<details><summary>All links from the CLI</summary>"
              echo
              echo "$urls" | sed 's/^/- /'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview link on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.wix.outputs.url }}
        with:
          script: |
            const marker = '<!-- wix-preview-link -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const when = new Date().toLocaleString('en-US', { timeZone: 'America/Chicago', dateStyle: 'medium', timeStyle: 'short' });
            const body = [
              marker,
              '### Preview this change',
              '',
              `**[Open the preview site](${process.env.PREVIEW_URL})**`,
              '',
              `Latest build: \`${sha}\` · ${when} (Central). This link is updated on every push to this PR, so it always shows the newest version.`,
              '',
              '<sub>Forms, donations and the store on the preview use the live Wix backend.</sub>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  release:
    name: Release to production
    # Published releases (not pre-releases) and manual runs.
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: wix-release-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.faithreins.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build site
        run: |
          npm ci || npm install
          npm run build
          python scripts/wix-postbuild.py

      - name: Log in to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Repo secret WIX_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes -p "$WIX_CLI" wix login --api-key "$WIX_API_KEY"

      - name: Release to Wix
        run: |
          set -o pipefail
          npx --yes -p "$WIX_CLI" wix release 2>&1 | tee release.log
          {
            echo "## Released to production"
            echo
            echo "Version \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`) is live at https://www.faithreins.com"
            echo
            echo "<details><summary>Links from the CLI</summary>"
            echo
            grep -oE 'https://[^"'"'"' )<>]+' release.log | sed 's/[.,;]*$//' | awk '!seen[$0]++' | sed 's/^/- /'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
