name: Deploy web
# Builds the Astro site and releases it to the live Wix Headless site
# (faithreins.com, metasite 2d8c6050-5730-4bed-9c7a-266ca7bd00b4 per wix.config.json).
# Requires repo secret WIX_API_KEY: a Wix API key from the account that owns the site.
on:
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check Wix API key is set
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::error::Repo secret WIX_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm ci || npm install
      - run: npm run build
      - name: Prepare output for Wix hosting
        run: python scripts/wix-postbuild.py
      - name: Find Wix account ID
        env:
          C1: ${{ secrets.WIX_ACCOUNT_ID }}
          C2: ${{ vars.WIX_ACCOUNT_ID }}
          C3: ${{ secrets.ACCOUNT_ID }}
          C4: ${{ vars.ACCOUNT_ID }}
          C5: ${{ secrets.WIX_ACCOUNT }}
          C6: ${{ vars.WIX_ACCOUNT }}
        run: |
          for n in 1 2 3 4 5 6; do
            v=$(eval echo "\$C$n" | tr -d '[:space:]')
            if [ -n "$v" ]; then
              echo "WIX_ACCOUNT_ID=$v" >> "$GITHUB_ENV"
              echo "::notice title=account id::found in candidate $n (1/2=WIX_ACCOUNT_ID secret/var, 3/4=ACCOUNT_ID, 5/6=WIX_ACCOUNT), length ${#v}"
              exit 0
            fi
          done
          echo "::warning title=account id::No account ID found under WIX_ACCOUNT_ID, ACCOUNT_ID or WIX_ACCOUNT (secret or variable)"
      - name: Check API key against Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          [ -z "$WIX_ACCOUNT_ID" ] && { echo "::warning::skipping key check, no account ID"; exit 0; }
          code=$(curl -sS -o sites.json -w '%{http_code}' -X POST https://www.wixapis.com/site-list/v2/sites/query \
            -H "Authorization: $WIX_API_KEY" -H "wix-account-id: $WIX_ACCOUNT_ID" -H 'Content-Type: application/json' \
            -d '{"query":{"filter":{"namespace":"HEADLESS"},"cursorPaging":{"limit":100}}}')
          found=$(grep -c '2d8c6050-5730-4bed-9c7a-266ca7bd00b4' sites.json || true)
          echo "::notice title=key check::sites query HTTP $code, live site visible: $found"
          [ "$code" != "200" ] && echo "::error title=key check::$(head -c 300 sites.json)"
          true
      - name: Log in to Wix
        run: npx --yes @wix/cli@latest login --api-key "$WIX_API_KEY"
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
      - name: Release to Wix
        env:
          CI: "true"
          COLUMNS: "400"
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -o pipefail
          npx --yes @wix/cli@latest release 2>&1 | tee release.log || {
            sed 's/\x1b\[[0-9;]*m//g' release.log | tr '\n' ' ' | tr -s ' ' > clean.log
            grep -oE '"url": ?"[^"]{0,200}"' clean.log | sort -u | head -3 | while IFS= read -r l; do echo "::error title=url::$l"; done
            grep -oE '"message": ?"[^"]{0,400}"' clean.log | sort -u | head -4 | while IFS= read -r l; do echo "::error title=message::$l"; done
            grep -oiE '.{0,200}(error|denied)[^"]{0,200}' clean.log | grep -v '"message"' | head -2 | while IFS= read -r l; do echo "::error title=context::$l"; done
            exit 1
          }
          tail -n 15 release.log | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice title=wix release::$line"
          done
