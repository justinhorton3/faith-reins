name: Import approved Outerwear V7 hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-approved-outerwear.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/sync-outerwear-assets.py
      - name: Commit exact approved Outerwear assets and vest concept crops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/shop/v7/heroes/outerwear-*.webp
          git add public/assets/shop/v7/catalog/mens-forest-green-quilted-vest-*.webp
          git add brand/v7-design-system/foundations/photography/storefront/outerwear/
          git add brand/v7-design-system/FILE-CHECKSUMS.json
          git add docs/storefront-heroes/outerwear-assets.json
          git diff --cached --check
          git commit -m "assets(shop): archive approved Outerwear heroes and men’s vest concepts"
          git push origin HEAD:main
