name: Import approved Women V7 hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-approved-women.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Preserve the approved Women’s photograph and responsive crops
        run: python scripts/sync-women-assets.py
      - name: Commit only approved Women’s assets and archive checksum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/shop/v7/heroes/women-*.webp
          git add brand/v7-design-system/foundations/photography/storefront/women/
          git add brand/v7-design-system/FILE-CHECKSUMS.json
          git add docs/storefront-heroes/women-assets.json
          git diff --cached --check
          git commit -m "assets(v7): commit approved Women’s porch hero for desktop and mobile"
          git push origin HEAD:main
