name: Validate account services
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/account*', 'scripts/*account*', 'package*.json', '.github/workflows/validate-accounts.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/account-service.test.mjs
      - run: npm run build
