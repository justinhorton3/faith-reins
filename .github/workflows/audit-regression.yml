name: Audit regression checks

on:
  push:
    branches: [Audit_10.18.26]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/configure-audit-*.mjs'
      - 'scripts/wix-postbuild.py'
      - 'scripts/verify-*.mjs'
      - 'scripts/audit-live-metadata.mjs'
      - 'astro.config.mjs'
      - 'tests/audit-batch-*.test.mjs'
      - 'package*.json'
      - '.github/workflows/audit-regression.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify audit regressions
        run: npm run test:audit
      - name: Build public pages
        run: npm run build
      - name: Verify hosting registry, canonical routes and navigation
        run: |
          python scripts/wix-postbuild.py
          node scripts/verify-audit-seo.mjs
          node scripts/verify-navigation.mjs
          node scripts/verify-shop-category-routes.mjs
