name: Audit regression checks

on:
  push:
    branches: [Audit_10.18.26]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/configure-audit-giving.mjs'
      - 'tests/audit-batch-01.test.mjs'
      - 'package*.json'
      - '.github/workflows/audit-regression.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify donor, callback and team regressions
        run: npm run test:audit
      - name: Build public pages
        run: npm run build
