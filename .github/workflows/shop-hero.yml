name: Validate shop hero
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/shop-hero.mjs'
      - 'src/lib/pages-main.mjs'
      - 'src/styles/shop-hero.css'
      - 'public/assets/shop/v7/coffee-porch.webp'
      - 'src/layouts/Base.astro'
      - 'tests/shop-hero.spec.js'
      - '.github/workflows/shop-hero.yml'
permissions:
  contents: read
jobs:
  hero-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/shop-hero.spec.js --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-hero-responsive-screenshots
          path: test-results/
          retention-days: 7
