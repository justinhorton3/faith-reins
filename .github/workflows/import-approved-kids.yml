name: Import approved Kids V7 image assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-kids.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Save approved image and responsive website derivatives
        run: python scripts/sync-kids-assets.py
      - name: Commit only Kids assets and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/shop/v7/heroes/kids-*.webp
          git add public/assets/shop/v7/catalog/kids-*.webp
          git add brand/v7-design-system/foundations/photography/storefront/kids/
          git add docs/storefront-heroes/kids-assets.json
          git diff --cached --check
          git commit -m "assets(v7): archive approved kids seal hero and catalog crops"
          git push origin HEAD:main
