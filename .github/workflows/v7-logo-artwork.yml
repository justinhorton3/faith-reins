name: V7 exact-font logo outlines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-logo-artwork.yml'
      - 'scripts/generate-v7-website-logo.py'
      - 'v7-design-system/candidates/website-logo/*.svg'
      - 'public/fonts/hanken-grotesk.woff'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-v7-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source vector tooling
        run: pip install fonttools brotli cairosvg pillow
      - name: Generate exact v6 Hanken outlines and responsive proof renders
        run: python scripts/generate-v7-website-logo.py
      - name: Commit approved production artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v7-design-system/approved/website-logo
          git diff --cached --quiet && exit 0
          git commit -m "brand(v7): export exact Hanken website SVG masters"
          git push
