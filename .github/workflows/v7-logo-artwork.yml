name: Validate standalone V7 package
on:
  pull_request:
    paths: ['brand/v7-design-system/**', '.github/workflows/v7-logo-artwork.yml']
  push:
    branches: [main]
    paths: ['brand/v7-design-system/**', '.github/workflows/v7-logo-artwork.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 brand/v7-design-system/scripts/validate.py --check
      - name: Check package without website or V6 siblings
        run: |
          isolated=$(mktemp -d)
          cp -R brand/v7-design-system "$isolated/v7-design-system"
          python3 "$isolated/v7-design-system/scripts/validate.py" --check
