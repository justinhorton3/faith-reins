name: Import owner-approved Hats V7 hero and category
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-hats.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: npm ci --no-audit --no-fund
      - name: Archive approved Hats image and connect Hats page
        run: python scripts/sync-hats-assets.py
      - name: Validate V7 standalone design system
        run: python brand/v7-design-system/scripts/validate.py --check
      - name: Build website with new Hats category
        run: npm run build
      - name: Rewrite URLs for Wix static host
        run: python scripts/wix-postbuild.py
      - name: Verify category, SEO and asset integrity
        run: node scripts/verify-shop-category-routes.mjs
      - name: Commit Hats hero, V7 archive and category as one reviewed batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-shop-category-routes.mjs
          git add src/lib/shop-category-pages.json
          git add public/assets/shop/v7/heroes/hats-*.webp
          git add brand/v7-design-system/foundations/photography/storefront/hats/
          git add brand/v7-design-system/merchandise/storefront/hats.md
          git add brand/v7-design-system/merchandise/storefront/SEO-ROUTES.md
          git add brand/v7-design-system/merchandise/storefront/EXECUTION-PLAN.md
          git add brand/v7-design-system/FILE-CHECKSUMS.json
          git add docs/storefront-heroes/hats-assets.json
          git diff --cached --check
          git commit -m "feat(shop): owner-approved Hats hero, V7 assets and SEO category"
          git push origin HEAD:main
