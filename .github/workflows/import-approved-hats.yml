name: Import approved Hats V7 hero
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-approved-hats.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Archive exact approved Hats hero and responsive derivatives
        run: python scripts/sync-hats-assets.py
      - name: Validate standalone V7 package
        run: python brand/v7-design-system/scripts/validate.py --check
      - name: Commit owner-approved Hats assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/shop/v7/heroes/hats-*.webp
          git add brand/v7-design-system/foundations/photography/storefront/hats/
          git add brand/v7-design-system/FILE-CHECKSUMS.json
          git add docs/storefront-heroes/hats-assets.json
          git diff --cached --check
          git commit -m "assets(shop): archive approved Hats hero desktop/mobile"
          git push origin HEAD:main
