name: Validate repository ownership

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main, work]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate independent website and brand directories
        run: python scripts/validate-brand-boundaries.py

      - name: Check Markdown whitespace
        run: git diff --check
