name: Validate polo showcase
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/assets/shop/v7/polos/**'
      - 'tests/polo-showcase.spec.js'
      - '.github/workflows/polo-showcase.yml'
      - 'package*.json'
      - 'playwright.config.ts'
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/polo-showcase.spec.js --reporter=line --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polo-showcase-browser-results
          path: test-results/
          retention-days: 7
