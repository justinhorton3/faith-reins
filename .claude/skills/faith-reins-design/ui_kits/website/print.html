<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Faith Reins — DesignSystem_v6 — Site mocks</title>
<meta name="omelette-owns-print" content="1">
<link rel="stylesheet" href="../../styles.css">
<style>@page{size:8.5in 11in;margin:.4in}html,body{margin:0;background:#fff}@media print{.fr-sheet-break{break-before:page}}.fr-frame section,.fr-frame header,.fr-frame footer,.fr-frame figure,.fr-frame img,.fr-frame h1,.fr-frame h2,.fr-frame h3,.fr-frame p,.fr-frame li,.fr-keep{break-inside:avoid;page-break-inside:avoid}a{color:#173A2E}a:hover{color:#7A5E2E}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
</head><body><div id="root"></div>
<script>
// Uses the compiled design-system bundle when present; otherwise loads component sources directly.
window.findFR = function () { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Lockup && v.Button && v.SiteHeader) return v; } catch (e) {} } return null; };
window.FR_FILES = ['core/responsive', 'core/Button', 'core/TextLink', 'core/Eyebrow', 'brand/HorseMark', 'brand/Lockup', 'layout/Section', 'layout/Split', 'forms/TextField', 'forms/Select', 'forms/Checkbox', 'content/PhotoSlot', 'content/PhotoBand', 'content/Testimonial', 'content/CredentialStrip', 'content/GiftCallout', 'content/Hero', 'content/SectionHeading', 'content/TherapyIndex', 'content/AudienceTiles', 'content/SplitFeature', 'content/FAQItem', 'content/InfoGrid', 'content/Steps', 'content/CheckList', 'content/CTABand', 'content/Prose', 'content/ProfileCard', 'commerce/ProductCard', 'commerce/GiveForm', 'navigation/SiteHeader', 'navigation/SiteFooter'];
window.loadFR = async function () {
  const found = findFR();
  const NS = found ? Object.assign({}, found) : {};
  const need = found ? (found.useBreakpoint ? [] : ['core/responsive']) : FR_FILES;
  const srcs = await Promise.all(need.map((f) => fetch('../../components/' + f + '.jsx').then((r) => r.text())));
  srcs.forEach((src) => {
    const names = [...src.matchAll(/export (?:function|const) (\w+)/g)].map((m) => m[1]);
    src = src.replace(/^import .*$/gm, '').replace(/export (function|const)/g, '$1');
    const code = Babel.transform(src, { presets: ['react'] }).code;
    Object.assign(NS, new Function('React', 'NS', 'with (NS) {' + code + '\nreturn {' + names.join(',') + '};}')(React, NS));
  });
  return NS;
};
</script>
<script type="text/babel" src="pages/_shared.jsx"></script>
<script type="text/babel" src="pages/Home.jsx"></script>
<script type="text/babel" src="pages/Therapies.jsx"></script>
<script type="text/babel" src="pages/Families.jsx"></script>
<script type="text/babel" src="pages/About.jsx"></script>
<script type="text/babel" src="pages/Giving.jsx"></script>
<script type="text/babel" src="pages/Legal.jsx"></script>
<script type="text/babel">
const ORDER = ["home","book-online","services-programs","occupational-therapy","physical-therapy","speech-language-therapy","counseling","equine-assisted-learning","for-families","our-team","our-mission","contact","faq","give","payment-and-insurance","for-referring-providers","our-horses","our-partners","impact-and-stewardship","sponsorships","shop","join-our-team","privacy","accessibility","donation-policy"];
const SHEETS = [[['Desktop · 1440', 1440, 0.51]], [['Tablet · 768', 768, 0.47], ['Mobile · 375', 375, 0.9]]];
const noop = () => {};
function Frame({ FR, slug, w, z }) {
  const { SiteHeader, SiteFooter, ViewportWidthContext } = FR;
  const page = window.PAGES[slug];
  const P = () => page.render(FR, noop);
  return (
    <div className="fr-frame" style={{ width: w * z, flex: 'none', outline: '1px solid #D8CDB8' }}>
      <div style={{ width: w, zoom: z, background: 'var(--fr-cream)' }}>
        <ViewportWidthContext.Provider value={w}>
          <SiteHeader tone="light" sticky={false} active={page.nav} assetBase="../../assets/logo/" onLogo={noop} onNavigate={noop} onCta={noop} />
          <main><P /></main>
          <SiteFooter assetBase="../../assets/logo/" onNavigate={noop} onGive={noop} />
        </ViewportWidthContext.Provider>
      </div>
    </div>
  );
}
const label = { font: '600 11px/1 var(--font-sans)', letterSpacing: '.2em', textTransform: 'uppercase', color: '#7A5E2E' };
function Doc({ FR }) {
  const { Lockup } = FR;
  React.useEffect(() => { const t = setInterval(() => document.querySelectorAll('img[loading="lazy"]').forEach((im) => { im.loading = 'eager'; }), 400); return () => clearInterval(t); }, []);
  return (<div style={{ fontFamily: 'var(--font-sans)', color: 'var(--fr-ink)' }}>
    <section style={{ height: '10.1in', breakInside: 'avoid', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', padding: '0.6in', boxSizing: 'border-box', background: 'var(--fr-cream)' }}>
      <Lockup size="md" assetBase="../../assets/logo/" />
      <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
        <span style={label}>DesignSystem_v6 · Site mocks for sign-off</span>
        <span style={{ font: '400 48px/1.08 var(--font-serif)', color: 'var(--fr-green)' }}>All 25 pages at desktop, tablet and mobile</span>
        <span style={{ fontSize: 18, color: 'var(--fr-muted)' }}>Built for the Wix Headless site in justinhorton3/faith-reins. Desktop 1440 · Tablet 768 · Mobile 375. Zoom in for detail: all type is vector.</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '6px 20px', fontSize: 13, color: 'var(--fr-ink)' }}>{ORDER.map((s, n) => <span key={s}>{String(n + 1).padStart(2, '0')} · {window.PAGES[s].title}</span>)}</div>
    </section>
    {ORDER.map((s, n) => SHEETS.map((cols, k) => (
      <section key={s + k} className="fr-sheet-break" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div className="fr-keep" style={{ display: 'flex', alignItems: 'baseline', gap: 14, borderBottom: '1px solid #D8CDB8', paddingBottom: 8 }}>
          <span style={label}>{String(n + 1).padStart(2, '0')} / 25</span>
          <span style={{ font: '400 24px/1 var(--font-serif)', color: 'var(--fr-green)' }}>{window.PAGES[s].title}</span>
          <span style={{ fontSize: 12, color: 'var(--fr-muted)', marginLeft: 'auto' }}>{cols.map((c) => c[0]).join('  +  ')}</span>
        </div>
        <div style={{ display: 'flex', gap: 18, alignItems: 'flex-start', justifyContent: 'center' }}>
          {cols.map(([t, w, z]) => <Frame key={t} FR={FR} slug={s} w={w} z={z} />)}
        </div>
      </section>
    )))}
  </div>);
}
loadFR().then((FR) => ReactDOM.createRoot(document.getElementById('root')).render(<Doc FR={FR} />));
</script></body></html>
